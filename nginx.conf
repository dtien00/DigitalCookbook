server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: serve index.html for any unmatched path so react-router-dom
    # deep links (/recipe/:id, /profile, /bookmarks, …) resolve client-side
    # instead of 404ing. This is the nginx equivalent of the Vercel rewrite in
    # vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames (content hash), so they can be cached
    # aggressively and forever — a new build emits new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
