name: CI

# Run on every push to main and on every pull request. Keeps main green and
# gives each PR a pass/fail signal before merge.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Errors block the build; the documented react-hooks/exhaustive-deps
      # omissions surface as advisory warnings (see .eslintrc.cjs). The stricter
      # `npm run lint` (--max-warnings 0) is the local aspirational gate.
      - name: Lint
        run: npx eslint . --ext js,jsx

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates the multi-stage Dockerfile compiles and produces an image on
      # every change. No registry push — this is a build-only smoke check.
      - name: Build image
        run: docker build -t digital-cookbook:ci .
